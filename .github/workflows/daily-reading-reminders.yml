name: Daily Reading Reminders & Welcome Emails

# AUTOMATION PAUSED: Scheduled runs are disabled pending review.
on:
  # schedule:
  #   - cron: '30 2 * * *'   # 8:00 AM IST
  #   - cron: '30 13 * * *'  # 7:00 PM IST
  workflow_dispatch: # Allows manual trigger only when needed

jobs:
  send-reminders:
    name: Process Welcome Emails & Reading Reminders
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute Daily Email Automation
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
        run: node scripts/daily-reminders.js
