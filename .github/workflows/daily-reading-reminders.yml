name: Daily Reading Reminders & Welcome Emails

on:
  schedule:
    # Runs at 02:30 UTC = 8:00 AM Indian Standard Time (IST) every day
    - cron: '30 2 * * *'
    # Runs at 13:30 UTC = 7:00 PM Indian Standard Time (IST) every day
    - cron: '30 13 * * *'
  workflow_dispatch: # Allows triggering manually from GitHub anytime with 1 click

jobs:
  send-reminders:
    name: Process Welcome Emails & Reading Reminders
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute Daily Email Automation
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: node scripts/daily-reminders.js
