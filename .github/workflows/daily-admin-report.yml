name: Daily Founder Reading & Activity Report

on:
  schedule:
    # 5:03 PM UTC = 10:33 PM IST (Off-peak minute to avoid GitHub Actions queue delays)
    - cron: '3 17 * * *'
  workflow_dispatch: # Allows manual run anytime from GitHub Actions tab

jobs:
  send-admin-report:
    name: Generate & Email Daily Progress Report to Founder
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate and Send Admin Report
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM || 'Relations With God Reports <connect@relationswithgod.in>' }}
          ADMIN_REPORT_EMAIL: 'jerishbtech@gmail.com'
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: node scripts/daily-admin-report.js
